<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amartt — Em breve</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17130d;
      color: #f5f0e8;
      font-family: Georgia, serif;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: 0.12em; text-transform: uppercase; }
    p { margin-top: 16px; font-size: 1.1rem; opacity: 0.6; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <div>
    <h1>Amartt</h1>
    <p>Em breve</p>
  </div>
</body>
</html>
